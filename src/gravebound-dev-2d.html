<title>Gravebound Pinball Dev</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Grenze+Gotisch:wght@500;700&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* layout: one tall stone table in the middle; the quest ledger hangs on its left, the hero's sheet on its right */
:root{
  --void:#07070b; --stone:#14131c; --stone-2:#201d2d; --line:#3a3650; --bone:#ece4cf; --ash:#a39cb2;
  --gold:#d9a441; --blood:#c0283c; --frost:#62d8ff; --moss:#7dffb0; --violet:#b79cff;
  --display:"Grenze Gotisch","Old English Text MT",Georgia,serif;
  --label:Cinzel,"Trajan Pro",Georgia,serif;
  --body:Spectral,Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--bone);font:15px/1.5 var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);background:radial-gradient(120% 80% at 50% 0%,#17131f 0%,var(--void) 70%)}
.side{display:none;min-width:0;width:100%;max-width:300px;box-sizing:border-box;padding-block:26px;padding-inline:22px;overflow-y:auto;scrollbar-width:thin}
#journal{grid-column:1;justify-self:end}
#sheet{grid-column:3;justify-self:start}
@media (min-width:1080px){#app.playing .side{display:block}}
#stage{container-type:inline-size;grid-column:2;position:relative;height:100%;overflow:hidden;background:#050508;touch-action:none;box-shadow:0 0 0 1px var(--line),0 0 90px #000}

h1,h2,h3,h4,p,dl,dd,ol,ul{margin:0;padding:0}
h3{font:700 11px/1.2 var(--label);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-block:20px 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.side h3:first-child{margin-top:0}
h4{font:500 23px/1.05 var(--display);color:var(--bone);text-wrap:balance}
.flav{font-style:italic;color:var(--ash);font-size:14px;margin-top:4px}
.side p{font-size:14px;color:#cfc7b6}
.steps{list-style:none;margin-top:12px;display:grid;gap:7px}
.steps li{display:grid;gap:1px;padding-left:16px;position:relative;color:#6f6a7e;font-size:13.5px;line-height:1.35}
.steps li::before{content:"";position:absolute;left:0;top:6px;width:7px;height:7px;border:1px solid currentColor;transform:rotate(45deg)}
.steps li b{font:700 10px var(--label);letter-spacing:.16em;text-transform:uppercase}
.steps li.done{color:#8d867a}.steps li.done::before{background:currentColor}
.steps li.cur{color:var(--bone)}.steps li.cur b{color:var(--gold)}.steps li.cur::before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px var(--gold)}
.sq{display:grid;gap:2px;margin-bottom:14px;padding-left:12px;border-left:2px solid var(--frost)}
.sq h4{font-size:20px}.sq em{font-size:12.5px;color:var(--ash)}.sq span{font-size:13.5px}
#sheet dl{display:grid;grid-template-columns:1fr auto;gap:3px 12px;margin-top:10px;font-size:14px}

.tags{list-style:none;display:flex;flex-wrap:wrap;gap:5px}
.tags li{font-size:12.5px;padding:2px 8px;border:1px solid var(--line);background:var(--stone)}
.tags li.none{border:0;background:none;color:#6f6a7e;font-style:italic;padding-left:0}

#hud{position:absolute;inset:0 0 auto 0;box-sizing:border-box;padding:9px 46px 22px 12px;display:grid;gap:5px;pointer-events:none;background:linear-gradient(#07070bf2,#07070bb0 62%,#07070b00)}
.hrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px}
.who{font:700 10.5px/1.3 var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.who b{color:var(--bone)}
.who.r{text-align:right}
#hScore{font:700 clamp(26px,7.4vmin,42px)/.95 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.02em;text-shadow:0 0 20px rgba(217,164,65,.55),0 2px 0 #000}
#hBalls i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bone);margin-left:4px;box-shadow:0 0 6px var(--frost)}
#hGold{color:var(--gold)}
.bars{display:grid;grid-template-columns:5fr 3fr;gap:5px}

.bar.hp i{background:linear-gradient(#e0475a,#8c1626)}.bar.hp.low{border-color:var(--blood);animation:pulse .6s infinite alternate}
.bar.ch i{background:linear-gradient(#8fd6ff,#3566b8)}
.bar.ch::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 33%,#000 33%,#000 calc(33% + 2px),transparent calc(33% + 2px),transparent 66%,#000 66%,#000 calc(66% + 2px),transparent calc(66% + 2px))}
.bar.ch.full{border-color:var(--frost);box-shadow:0 0 10px var(--frost)}
.pw{margin-bottom:8px}.pw b{color:var(--bone)}
.ver{font:700 9.5px var(--label);letter-spacing:.2em;text-transform:uppercase;color:#6f6a7e}
.bar.xp{grid-column:1/-1;height:3px;border:0;background:#fff1}.bar.xp i{background:var(--gold)}
#hObj{text-align:center;font:italic 14px/1.25 var(--body);color:#f4e6bf;text-shadow:0 1px 3px #000,0 0 10px #000;text-wrap:balance}
#hFx{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;min-height:18px}
.chip{font:700 8.5px/1 var(--label);letter-spacing:.12em;text-transform:uppercase;padding:4px 7px;background:#000b;border:1px solid var(--line);color:var(--bone)}
.chip.gold{border-color:var(--gold);color:var(--gold)}.chip.frost{border-color:var(--frost);color:var(--frost)}.chip.moss{border-color:var(--moss);color:var(--moss)}
.chip.violet{border-color:var(--violet);color:var(--violet)}.chip.bad{border-color:var(--blood);color:#ff8a94}
#bossbar{display:grid;gap:3px;justify-items:center;text-align:center;margin-top:2px}

#pauseBtn{position:absolute;top:8px;right:8px;width:30px;height:30px;padding:0;font:700 11px var(--label);letter-spacing:.1em}

#banner{position:absolute;left:0;right:0;top:27%;display:grid;justify-items:center;pointer-events:none}
.bn{width:100%;box-sizing:border-box;padding:12px 22px;text-align:center;display:grid;gap:3px;background:linear-gradient(90deg,#07070b00,#07070be0 22%,#07070be0 78%,#07070b00);border-block:1px solid #d9a44166;animation:bn 2s both}
.bn h2{font:700 clamp(27px,8.5vmin,46px)/1 var(--display);color:var(--bone);text-shadow:0 0 22px currentColor,0 2px 0 #000;text-wrap:balance}

.bn small{font:italic 13.5px/1.35 var(--body);color:var(--ash);max-width:42ch;justify-self:center;text-wrap:balance}
.k-good,.k-info{padding-block:8px}.k-good h2,.k-info h2{font-size:clamp(22px,6vmin,32px)}
.k-quest h2{color:var(--frost)}.k-main h2,.k-level h2{color:var(--gold)}.k-boss h2{color:#ff5a68}.k-bad h2{color:#ff8a94}.k-good h2{color:var(--moss)}.k-mb h2{color:#ffd24a}
.k-boss{border-color:#c0283c99}
@keyframes bn{0%{opacity:0;transform:scale(1.12)}9%{opacity:1;transform:none}86%{opacity:1}100%{opacity:0}}
@keyframes pulse{to{box-shadow:0 0 12px var(--blood)}}
#bonus{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;background:#07070bcc;pointer-events:none}
#bonus h2{font:700 44px/1 var(--display);color:#ff8a94}
#bonus dl{display:grid;grid-template-columns:auto auto;gap:2px 22px;text-align:left}#bonus dt{color:var(--ash)}#bonus dd{text-align:right;font-variant-numeric:tabular-nums}
#bonus .big{font:700 36px/1 var(--display);color:var(--gold)}

#touch{position:absolute;inset:0;pointer-events:none}
#tL,#tR{position:absolute;top:24%;bottom:0;width:50%;pointer-events:auto}
#tL{left:0}#tR{right:0}
#tL::after,#tR::after{content:"Flip";position:absolute;bottom:20px;font:700 10px var(--label);letter-spacing:.2em;text-transform:uppercase;color:#ece4cf55;padding:22px 20px;border:1px solid #ece4cf22;border-radius:50%}
#tL::after{left:14px}#tR::after{right:14px}
#tN{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);pointer-events:auto;padding:11px 13px;font-size:10.5px;background:#14131c99;color:#ece4cfcc}

#menu{touch-action:pan-y;position:absolute;inset:0;z-index:5;box-sizing:border-box;display:grid;place-items:center;padding-block:20px;padding-inline:16px;overflow-y:auto;background:radial-gradient(90% 60% at 50% 40%,#07070b99,#07070bf0);-webkit-user-select:text;user-select:text}
#menu.attract{background:radial-gradient(80% 46% at 50% 44%,#07070bd9,#07070b66 70%,#07070b40)}
.pane{width:min(100%,400px);box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:26px 22px;background:linear-gradient(#17151ff5,#0e0d15f5);border:1px solid #d9a44155;outline:1px solid var(--line);outline-offset:5px}
.pane.wide{width:min(100%,640px)}
.pane.title{width:min(100%,460px);padding-inline:0;background:none;border:0;outline:0;text-align:center;gap:20px}
.pane.title nav{width:min(100%,340px);justify-self:center}
.eyebrow{font:700 11px var(--label);letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
h1{font:700 clamp(40px,14.5cqw,104px)/.82 var(--display);color:var(--bone);text-shadow:0 0 34px rgba(192,40,60,.75),0 3px 0 #000}
h1 span{display:block;margin-top:14px;font:700 clamp(13px,3.6vmin,18px)/1 var(--label);letter-spacing:.62em;text-indent:.62em;text-transform:uppercase;color:var(--gold);text-shadow:none}
.pane h2{font:700 36px/1 var(--display);text-wrap:balance}
.pane h2.score{font-size:54px;color:var(--gold);font-variant-numeric:tabular-nums}
.lead{color:#d3cab6;font-size:14.5px;max-width:60ch}
.hint{font:italic 13.5px var(--body);color:var(--ash)}
.sqline{font-size:14px;color:#cfc7b6}
nav{display:grid;gap:8px}nav.row{grid-auto-flow:column;justify-content:start}
button{font:700 12.5px/1.2 var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--bone);background:linear-gradient(var(--stone-2),var(--stone));border:1px solid var(--line);padding:13px 16px;cursor:pointer;border-radius:0}
button small{display:block;margin-top:5px;font:italic 12.5px var(--body);letter-spacing:0;text-transform:none;color:var(--ash)}
button:hover:not(:disabled){border-color:var(--gold)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-color:var(--gold)}
button:disabled{opacity:.42;cursor:default}
.cards{display:grid;gap:10px}
.cards.four{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{display:grid;gap:4px;text-align:left;align-content:start;padding:14px 16px;letter-spacing:0;text-transform:none;font:14px/1.4 var(--body)}
.card.cls{font-size:13.5px;line-height:1.35;padding:12px 14px}
.card b{font:500 26px/1 var(--display);color:var(--bone)}
.card small{margin:0;font:700 10px var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.card span{color:#cfc7b6}.card em{color:var(--bone)}
.card .stat{font:700 10px var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
.card.cls{grid-template-columns:auto 1fr;column-gap:12px}.card.cls>*{grid-column:2}
.orb{grid-column:1!important;grid-row:1/span 2;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff,var(--c) 30%,#11121c 100%);box-shadow:0 0 16px var(--g)}
.pane dl{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14.5px}.pane dt{color:var(--ash)}.pane dd{text-align:right;font-variant-numeric:tabular-nums}
.pane dl.keys{grid-template-columns:auto 1fr}.pane dl.keys dd{text-align:left}
label{display:grid;gap:6px;font:700 11px var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--ash)}
label.check{grid-auto-flow:column;justify-content:start;align-items:center;gap:10px}
input[type=text]{font:500 26px var(--display);color:var(--bone);background:#000a;border:1px solid var(--line);padding:8px 12px;border-radius:0;min-width:0}
input[type=range]{accent-color:var(--gold);width:100%}input[type=checkbox]{accent-color:var(--gold);width:18px;height:18px}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
th{font:700 10px var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--ash);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid #ffffff10}td:nth-child(3),th:nth-child(3){text-align:right}tr.me td{color:var(--gold)}
@media (prefers-reduced-motion:reduce){.bn{animation-name:bnr}.bar.hp.low{animation:none}}
@keyframes bnr{0%,100%{opacity:0}9%,86%{opacity:1}}
</style>
<div id="app">
  <aside class="side" id="journal" aria-label="Quest journal">

<script>
'use strict';
/* ================= UTIL ================= */
const PI=Math.PI,TAU=PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const irand=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=n=>Math.floor(n).toLocaleString('en-US');
const hash=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);};
const store={
  get(k,d){try{const v=localStorage.getItem('gravebound.'+k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('gravebound.'+k,JSON.stringify(v));}catch(e){}},
  del(k){try{localStorage.removeItem('gravebound.'+k);}catch(e){}}
};

/* ================= TABLE ================= */
const W=640,H=3180,GY=3270,HW=4010,BR=11,TY=[40,1080,2120,GY],FY=[940,1980,3020,GY+650],CELL=80,GRAV=1150,VMAX=2300;
const TIER_NAME=['The Black Keep','The Wilds','Grave Hollow','The Grave'];
const T={segs:[],grid:[],flips:[],bumps:[],sens:[],holes:{},rails:{},mouths:[],shots:{},banks:{},sets:{},
  slings:[],spawn:[[],[],[],[]],torches:[],wallPaths:[],blocks:[],chans:[],bossSpot:[],tunnels:{},posts:[]};
const tierOf=y=>y<TY[1]?0:y<TY[2]?1:y<GY-60?2:3;

function seg(x1,y1,x2,y2,o){const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;
  const s=Object.assign({x1,y1,x2,y2,dx,dy,len,l2:len*len,e:.45,w:0,kind:'wall',on:true,flash:0,cool:0},o||{});T.segs.push(s);return s;}
function poly(pts,o,style){for(let i=0;i<pts.length-1;i++)seg(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],o);
  if(style!=='none')T.wallPaths.push({pts,style:style||'rail',w:(o&&o.w)||0});}
function gseg(a,b,cx,cy){ // one-way: solid only for balls on the (cx,cy) side
  const s=seg(a[0],a[1],b[0],b[1],{kind:'gate',e:.3,ow:true});let nx=-s.dy/s.len,ny=s.dx/s.len;
  if((cx-a[0])*nx+(cy-a[1])*ny<0){nx=-nx;ny=-ny;}s.onx=nx;s.ony=ny;return s;}
function gpoly(pts,cx,cy){for(let i=0;i<pts.length-1;i++)gseg(pts[i],pts[i+1],cx,cy);T.wallPaths.push({pts,style:'gate'});}
function arcPts(cx,cy,r,a0,a1,n){const p=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;p.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}return p;}
function block(pts,o){poly(pts.concat([pts[0]]),{},'none');T.blocks.push(Object.assign({pts},o||{}));}
function bumper(x,y,r,group,tier,o){const b=Object.assign({x,y,r,group,tier,kick:470,flash:0,cool:0,ward:false},o||{});T.bumps.push(b);return b;}
function sensor(x,y,r,o){const s=Object.assign({x,y,r,cool:0,lit:false,flash:0},o);T.sens.push(s);return s;}
function hole(id,x,y,r,tier,name){T.holes[id]={id,x,y,r,tier,name,glow:0,busy:0};}
function shotDef(id,name,tier,x,y,ang,kind){T.shots[id]={id,name,tier,x,y:y+TY[tier],ang:ang===undefined?-PI/2:ang,kind:kind||'arrow'};}
function bank(id,tier,p0,p1,n,kind,o){o=o||{};
  const B=T.banks[id]||(T.banks[id]={id,tier,kind,segs:[],reset:0,name:o.name||id});
  const dx=p1[0]-p0[0],dy=p1[1]-p0[1],len=Math.hypot(dx,dy);let nx=-dy/len,ny=dx/len;if(ny<0){nx=-nx;ny=-ny;}
  const pad=o.pad||0,off=kind==='target'?4.5:0,g=.05;
  for(let k=0;k<n;k++){const t0=pad+(1-2*pad)*(k+g)/n,t1=pad+(1-2*pad)*(k+1-g)/n;
    B.segs.push(seg(p0[0]+dx*t0+nx*off,p0[1]+dy*t0+ny*off,p0[0]+dx*t1+nx*off,p0[1]+dy*t1+ny*off,
      {kind,bank:id,tier,w:kind==='drop'?3:2.5,e:.3,lit:false,nx,ny}));}
  return B;}
function mouthGeo(px,py,sx){const dx=sx*.38,dy=-.925,qx=.925,qy=sx*.38;
  const lb=[px-qx*28,py-qy*28],rb=[px+qx*28,py+qy*28]; // a funnel: 56 wide at the lip, 38 at the throat
  return {d:[dx,dy],lb,rb,lt:[px+dx*70-qx*19,py+dy*70-qy*19],rt:[px+dx*70+qx*19,py+dy*70+qy*19],c0:[px+dx*36,py+dy*36],c1:[px+dx*100,py+dy*100],p:[px,py]};}
function catmull(P,n){const o=[];for(let i=0;i<P.length-1;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];
  for(let j=0;j<n;j++){const t=j/n,t2=t*t,t3=t2*t,q=[0,0];
    for(let k=0;k<2;k++)q[k]=.5*((2*p1[k])+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3);o.push(q);}}
  o.push(P[P.length-1]);return o;}
function resample(pts,ds){const x=[pts[0][0]],y=[pts[0][1]];let acc=0;
  for(let i=1;i<pts.length;i++){let ax=pts[i-1][0],ay=pts[i-1][1];const bx=pts[i][0],by=pts[i][1];let d=Math.hypot(bx-ax,by-ay);
    while(acc+d>=ds){const t=(ds-acc)/d;ax+=(bx-ax)*t;ay+=(by-ay)*t;x.push(ax);y.push(ay);d=Math.hypot(bx-ax,by-ay);acc=0;}acc+=d;}
  return {x,y,n:x.length,len:(x.length-1)*ds,ds};}

function newBall(x,y,vx,vy){const c=G.run&&CLASSES[G.run.cls];return {x,y,vx:vx||0,vy:vy||0,r:c?c.r:BR,kx:c?c.kx:1,cr:0,arm:0,pow:null,tk:0,st:'live',rail:null,rs:0,rv:0,hgt:0,rot:0,trail:[],still:0,noMouth:0,noHole:0,onFlip:0,age:0,tier:tierOf(y),sx:x,sy:y,held:null};}

function hitSeg(b,s){
  let t=((b.x-s.x1)*s.dx+(b.y-s.y1)*s.dy)/s.l2;t=t<0?0:t>1?1:t;
  const qx=s.x1+s.dx*t,qy=s.y1+s.dy*t;let nx=b.x-qx,ny=b.y-qy;const R=b.r+s.w,d2=nx*nx+ny*ny;
  if(d2>=R*R)return;
  if(s.ow&&(b.x-s.x1)*s.onx+(b.y-s.y1)*s.ony<=0)return;
  let d=Math.sqrt(d2);if(d<1e-5){nx=-s.dy/s.len;ny=s.dx/s.len;d=1e-5;}else{nx/=d;ny/=d;}
  b.x+=nx*(R-d);b.y+=ny*(R-d);
  const vn=b.vx*nx+b.vy*ny;if(vn>=0)return;
  const imp=-vn,e=imp<70?0:s.e;
  b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;
  const tx=-ny,ty=nx,vt=b.vx*tx+b.vy*ty,fr=imp<70?.0025:.03;b.vx-=tx*vt*fr;b.vy-=ty*vt*fr;
  if(imp<55)return;
  if(s.kind==='sling'){if(t>.1&&t<.9&&nx*s.kx+ny*s.ky>.5){const k=(G.slingRun>4?140:rand(420,580))*(.5+.5*b.kx);b.vx+=s.kx*k;b.vy+=s.ky*k+rand(-50,30);s.flash=1;ev('sling',s,b,imp);}}
  else if(s.kind==='target'){if(s.cool<=0){s.cool=.2;s.flash=1;ev('target',s,b,imp);}}
  else if(s.kind==='drop'){s.on=false;s.flash=1;ev('drop',s,b,imp);}
  else if(imp>160)ev('wall',s,b,imp);
}
function hitFlipper(b,f){

function stepFlippers(h){

    const target=(f.on&&!dead)?f.up:f.rest,sp=(f.on&&!dead)?-21*pw:13;
    let na=f.a+sp*h;if(sp<0&&na<target)na=target;if(sp>0&&na>target)na=target;

function stepBall(b,h){

    b.rv+=GRAV*r.k*p.ty*h;b.rv-=b.rv*.1*h;b.rs+=b.rv*h;b.hgt=Math.min(1,b.rs/80,(r.len-b.rs)/80);

function stepSensors(dt){

    if(b.noMouth>0)b.noMouth-=dt;else for(const m of T.mouths){const dx=b.x-m.x,dy=b.y-m.y;
      if(dx*dx+dy*dy<m.r*m.r){const v=b.vx*m.dx+b.vy*m.dy;if(v>90){b.st='rail';b.rail=T.rails[m.rail];b.rs=0;b.rv=v;b.hgt=0;ev('rampIn',b.rail,b);break;}}}

      if(dx*dx+dy*dy<h.r*h.r){b.st='held';b.held={id,t:0};b.x=h.x;b.y=h.y;b.vx=b.vy=0;h.glow=1;ev('hole',h,b);break;}}
    if(b.st!=='live')continue;
    for(const s of T.sens){const dx=b.x-s.x,dy=b.y-s.y;if(dx*dx+dy*dy<(s.r+4)*(s.r+4)){
      if(s.kind==='spin'){if(s.cool<=0){s.cool=.25;s.acc=s.acc||0;s.rate=Math.min(26,Math.hypot(b.vx,b.vy)/60);s.dir=b.vy<0?1:-1;}}

function collideBalls(){const B=G.balls;for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++){const a=B[i],b=B[j];if(a.st!=='live'||b.st!=='live')continue;

  const n=Math.max(1,Math.round(dt/SUB*(fine?4:1))),h=dt/n;
  for(let k=0;k<n;k++){stepFlippers(h);for(const b of G.balls)stepBall(b,h);if(G.balls.length>1)collideBalls();}

  for(const c of T.bumps){if(c.flash>0)c.flash-=dt*5;if(c.cool>0)c.cool-=dt;}
  for(const id in T.holes){const h=T.holes[id];if(h.glow>0)h.glow-=dt*1.5;}

}

    steps:[{t:'kill',e:'skeleton',tier:2,n:5,time:45,text:'Slay 5 skeletons before the gate falls'}],rw:{gold:60,xp:60}},
  {id:'patrol',name:'Night Patrol',giver:'The gatewatch',text:'Walk the road both ways. Shout if anything moves.',
    steps:[{t:'shot',id:'orbitL2',n:2,text:'Patrol the Night Road, west'},{t:'shot',id:'orbitR2',n:1,text:'Patrol the Night Road, east'}],rw:{gold:30,xp:35}},
  {id:'armory',name:'Steel for the Hollow',giver:'Quartermaster Pell',text:'The Keep armory is full and nobody alive is using it.',
    steps:[{t:'done',id:'armory',n:1,text:'Raid the Keep Armory'},{t:'shot',id:'tavern',n:1,text:'Deliver the steel to the Tavern'}],rw:{gold:50,xp:60,relic:1}},
  {id:'tower',name:'The Tower Stair',giver:'A mad astronomer',text:'Three times round the tower and the stars line up. Trust me.',
    steps:[{t:'shot',id:'rampTower',n:3,text:'Climb the Tower Ramp three times'}],rw:{xp:90,gold:40}}
];
const STAGES=['Omens','Omens','The Trail','The Wilds','The Ruined Gate','The Climb','The Keep','The Reckoning'];

/* ================= GAME STATE & RULES ================= */
const G={mode:'title',sub:null,paused:false,demo:false,auto:false,bot:null,balls:[],enemies:[],pickups:[],parts:[],floats:[],bolts:[],queue:[],pending:[],
  run:null,mods:{},boss:null,lit:{},cam:{y:TY[2]-20,ty:TY[2]-20,shake:0,viewH:1000},t:0,tilt:0,nudges:[],nudgeT:0,flipPow:1,in:{l:false,r:false,n:false},
  plunge:{ready:false,charge:0,held:false,auto:0},save:0,mb:null,choice:null,curse:{},buffs:{},combo:0,comboT:0,statues:[],flash:0,flashC:'#fff',
  booms:[],zones:[],phase:0,nudgeCd:0,hidden:false,inGrave:false,graveT:0,graveLive:false,spawnT:0,ambT:6,doorT:0,kickT:0,hutT:40,skill:-1,fallen:false,hurtT:0,dirty:true,orbitMem:{},focusTier:2,stuck:[],bonus:null};
const xpNeed=l=>Math.round(45*Math.pow(1.32,l-1));
function later(t,fn){G.queue.push({t,fn});}
function float(x,y,text,color,size){G.floats.push({x,y,text,color:color||'#ffe9b0',size:size||13,t:0});if(G.floats.length>40)G.floats.shift();}
function burst(x,y,n,color,sp,life){for(let i=0;i<n;i++){const a=rand(TAU),v=rand(.3,1)*(sp||220);G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:rand(.3,.8)*(life||1),color,size:rand(1.5,3.5)});}
  if(G.parts.length>450)G.parts.splice(0,G.parts.length-450);}
function bolt(a,b){if(!a||!b)return;const pts=[],n=7;for(let i=0;i<=n;i++){const t=i/n,j=i&&i<n?1:0;pts.push([lerp(a.x,b.x,t)+j*rand(-16,16),lerp(a.y,b.y,t)+j*rand(-16,16)]);}G.bolts.push({pts,t:0});}
function popup(title,sub,kind,note){if(G.demo)return;UI.popup(title,sub||'',kind||'info',note||'');}
function focusBall(){let f=null;for(const b of G.balls)if(!f||b.y>f.y)f=b;return f;}
function comboF(){return G.combo>1?1+.25*Math.min(8,G.combo-1)*(1+G.mods.comboPay):1;}

function initGame(){buildTable();
  G.statues=[{x:T.bossSpot[0].x,y:T.bossSpot[0].y,r:22,tier:0,id:'throne',on:true,flash:0,cool:0},{x:T.bossSpot[1].x,y:T.bossSpot[1].y,r:20,tier:1,id:'keystone',on:true,flash:0,cool:0}];}
function resetWorld(){G.gen=(G.gen||0)+1;Object.assign(G,{balls:[],enemies:[],pickups:[],queue:[],pending:[],boss:null,choice:null,sub:null,mb:null,tilt:0,fallen:false,curse:{},buffs:{},combo:0,comboT:0,save:0,paused:false,bonus:null,doorT:0,orbitMem:{},booms:[],zones:[],phase:0,nudgeCd:0,hidden:false,inGrave:false,graveLive:false});
  G.plunge={ready:false,charge:0,held:false,auto:0};
  for(const s of T.segs){if(s.bank){s.on=true;s.lit=false;}}for(const id in T.banks)T.banks[id].reset=0;
  for(const s of T.sens)s.lit=false;for(const c of T.bumps)c.ward=false;G.statues.forEach(s=>s.on=true);}

/* ---------- run ---------- */
function newRun(cls){const c=CLASSES[cls],meta=store.get('meta',{}),leg=G.demo?0:Math.min(100,(meta.bosses||0)*10);
  const r={cls,score:0,ballNum:1,ballsLeft:3,level:1,xp:0,hp:c.hp,gold:leg,mult:1,charge:0,perks:[],relics:[],kills:0,questsDone:0,bossKills:0,threat:1,
    main:null,side:[],doneSide:[],arcs:[],locks:0,lockLit:false,hoardLit:false,hutLit:true,kickback:true,shield:false,shop:true,time:0,grave:{hits:0,need:8,used:0,open:false},stat:{ramps:0,orbits:0,jackpots:0,bestCombo:0}};
  G.run=r;recalc();r.hp=G.mods.maxHp;r.main=makeCampaign(r);return r;}
function recalc(){const r=G.run,c=CLASSES[r.cls];
  const m={dmg:1,gold:1,xp:1,crit:c.crit,save:8+c.save,flip:c.flip,dr:c.dr,hp:0,charge:1,combo:5,comboPay:0,healKill:0,pierce:false,kickRelight:false,bumpGold:0,bumpDmg:0,multMin:1,laneHeal:0,killGold:0,rampHeal:0,jackpot:1,lockKeep:false};
  for(const id of r.perks){const p=PERKS.find(p=>p.id===id);if(p)p.f(m);}
  for(const id of r.relics){const p=RELICS.find(p=>p.id===id);if(p)p.f(m);}
  m.maxHp=c.hp+m.hp+(r.level-1)*8;m.pow=(c.pow+2*(r.level-1))*m.dmg;m.dr=Math.min(.75,m.dr);
  G.mods=m;if(r.hp>m.maxHp)r.hp=m.maxHp;if(r.mult<m.multMin)r.mult=m.multMin;G.dirty=true;}
function makeCampaign(r){const all=Object.keys(CAMPAIGNS),keys=all.filter(k=>!r.arcs.includes(k)),key=pick(keys.length?keys:all);r.arcs.push(key);
  const c=CAMPAIGNS[key],om=shuffle(c.omens),cp=o=>Object.assign({},o);
  const steps=[cp(om[0]),cp(om[1]),cp(c.trail),cp(pick(c.wilds)),{t:'boss',boss:'warden',n:1,text:'Defeat the Warden of the Ruined Gate'},
    {t:'shot',id:'rampRuin',n:1,text:'Climb the Ruin Stair into the Black Keep'},cp(pick(c.reveal)),{t:'boss',boss:c.boss,n:1,text:'Destroy '+BOSSES[c.boss].name}];
  return {main:true,key,name:c.name,text:c.intro,steps,si:0,prog:0,tl:0};}
function giveRelic(){const r=G.run,pool=RELICS.filter(x=>!x.stack&&!r.relics.includes(x.id));if(!pool.length){gold(60);return null;}const x=pick(pool);r.relics.push(x.id);recalc();return x;}
function saveRun(){if(G.demo||!G.run||G.mode!=='play')return;store.set('run',{v:2,run:G.run});}
function metaAdd(k,n){if(G.demo)return;const m=store.get('meta',{});m[k]=(m[k]||0)+(n||1);store.set('meta',m);}

/* ---------- quests ---------- */
function quests(){const r=G.run;return r?[r.main].concat(r.side).filter(Boolean):[];}
function qCur(q){return q.steps[q.si];}
function qResume(q){const o=qCur(q);if(!o)return;if(o.t==='boss')wakeBoss(o.boss);if(o.t==='collect')spawnPickup(o.tier,o.item||'relic',q);}
function qBegin(q){const o=qCur(q);if(!o)return;q.prog=0;q.tl=o.time||0;qResume(q);relight();}
function qAdd(q,n){const o=qCur(q);if(!o)return;q.prog+=n||1;G.dirty=true;
  if(q.prog>=o.n){q.si++;
    if(q.si>=q.steps.length)qFinish(q);
    else{qBegin(q);popup(q.main?STAGES[q.si]||'Main Quest':'Quest Updated',qCur(q).text,q.main?'main':'quest');A.s('quest');if(q.main){score(20000);xp(25);saveRun();}}}
  relight();}
function qEvent(kind,key,tier){for(const q of quests()){const o=qCur(q);if(!o||o.t!==kind)continue;
  if(kind==='kill'){if((o.e===key||o.e==='any')&&o.tier===tier)qAdd(q);}
  else if(kind==='collect'){if(key===q)qAdd(q);}
  else if((o.id||o.boss)===key)qAdd(q);}}
function qFinish(q){const r=G.run;
  if(q.main){const c=CAMPAIGNS[q.key];r.main=null;score(250000);xp(150);gold(100);popup('Main Quest Complete',c.win,'main');A.s('victory');metaAdd('wins');
    r.threat++;later(7,()=>{if(G.run!==r||r.main)return;r.main=makeCampaign(r);qBegin(r.main);popup('A New Shadow Rises',r.main.name,'boss',r.main.text);saveRun();});}
  else{r.side=r.side.filter(x=>x!==q);r.doneSide.push(q.id);r.questsDone++;const w=q.rw;score(25000);xp(w.xp||0);gold(w.gold||0);if(w.heal)heal(w.heal);
    let note=[w.gold?'+'+w.gold+' gold':'',w.xp?'+'+w.xp+' xp':''].filter(Boolean).join('  ');if(w.relic){const x=giveRelic();if(x)note+='  Relic: '+x.name;}
    popup('Quest Complete',q.name,'good',note);A.s('questDone');}
  saveRun();}
function qFail(q){const r=G.run;r.side=r.side.filter(x=>x!==q);G.enemies.forEach(e=>{if(e.quest===q)e.quest=null;});G.pickups=G.pickups.filter(p=>p.quest!==q);popup('Quest Failed',q.name,'bad');relight();}
function newSide(){const r=G.run;let pool=SIDE.filter(s=>!r.doneSide.includes(s.id)&&!r.side.some(q=>q.id===s.id));
  if(!pool.length){r.doneSide=[];pool=SIDE.filter(s=>!r.side.some(q=>q.id===s.id));}
  const s=pick(pool),q={id:s.id,name:s.name,giver:s.giver,text:s.text,steps:s.steps.map(o=>Object.assign({},o)),rw:s.rw,si:0,prog:0,tl:0};
  r.side.push(q);qBegin(q);popup('Quest Accepted',s.name,'quest',s.giver+': “'+s.text+'”');A.s('quest');return q;}
function relight(){const L={},add=(id,c)=>{(L[id]||(L[id]=[])).push(c);},r=G.run;G.lit=L;if(!r)return;G.dirty=true;
  if(G.inGrave){add('rise',T.banks.nails.segs.some(x=>x.on)?'main':'gold');return;}
  const ft=G.focusTier,way=(tier,c)=>{if(ft>tier){if(ft===2){add('rampForest',c);add('crypt',c);}else{add('rampRuin',c);add('secret',c);}}else if(ft<tier&&ft===0)add('oubliette',c);};
  for(const q of quests()){const o=qCur(q);if(!o)continue;const c=q.main?'main':'side';
    if(o.t==='shot'||o.t==='done'){add(o.id,c);const s=T.shots[o.id];if(s)way(s.tier,c);}
    else if(o.t==='boss')way(BOSSES[o.boss].tier,c);else way(o.tier,c);}
  if(r.lockLit)add('catacombs','lock');if(r.hoardLit)add('sanctum','gold');if(r.hutLit)add('hut','soft');
  if(r.side.length<2||(r.shop&&r.gold>=25))add('tavern','soft');
  if(G.doorT>0)add('secret','gold');else if(T.banks.door.segs.some(x=>!x.on))add('secret','soft');
  const bo=G.boss;if(bo&&bo.alive&&bo.phase==='cast')bo.def.cast.shots.forEach(id=>add(id,'danger'));
  if(G.mb)for(const id in T.rails)add(id,'gold');}

/* ---------- score / stats ---------- */
function score(n,x,y,label){const r=G.run;let v=n*r.mult;if(G.curse.hex>0)v*=.5;if(G.buffs.moon>0)v*=2;v=Math.round(v/10)*10;r.score+=v;G.dirty=true;
  if(x!==undefined&&v>=1000)float(x,y,(label?label+' ':'')+fmt(v),label?'#ffd24a':'#ffe9b0',v>=20000?17:12);return v;}
function gold(n,x,y){if(n<=0)return;const r=G.run,v=Math.ceil(n*G.mods.gold*(G.buffs.stealth>0?2:1));r.gold+=v;G.dirty=true;if(x!==undefined)float(x+10,y-16,'+'+v+'g','#ffd24a',12);}
function xp(n){const r=G.run;r.xp+=n*G.mods.xp;G.dirty=true;
  while(r.xp>=xpNeed(r.level)){r.xp-=xpNeed(r.level);r.level++;recalc();heal(20);r.shop=true;G.pending.push('perk');popup('Level Up','You are now level '+r.level,'level');A.s('level');}}
function heal(n){const r=G.run;r.hp=Math.min(G.mods.maxHp,r.hp+n);G.dirty=true;}
function hurt(n){const r=G.run;if(G.fallen||!G.balls.length)return;let v=n*(1-G.mods.dr);if(G.buffs.aegis>0)v*=.5;v=Math.max(1,Math.ceil(v));r.hp-=v;G.hurtT=.6;G.cam.shake=Math.max(G.cam.shake,8);A.s('hurt');
  const b=focusBall();if(b)float(b.x,b.y-22,'-'+v,'#ff5a5a',16);G.dirty=true;
  if(r.hp<=0){r.hp=0;G.fallen=true;G.tilt=1e9;G.save=0;r.shield=false;popup('Fallen','Your hero collapses. The flippers go dead','bad');A.s('tilt');}}
function charge(n,src){const r=G.run,k=CLASSES[r.cls].ch[src];if(!k||G.fallen)return;const was=r.charge;r.charge=Math.min(100,r.charge+k*n*G.mods.charge/Math.max(1,G.balls.length));G.dirty=true;if(was<100&&r.charge>=100){A.s('ward');const b=focusBall();if(b)float(b.x,b.y-34,CLASSES[r.cls].abil.toUpperCase()+' READY',CLASSES[r.cls].glow,14);}}
function major(x,y){const r=G.run;if(G.comboT>0)G.combo++;else G.combo=1;G.comboT=G.mods.combo;if(G.combo>r.stat.bestCombo)r.stat.bestCombo=G.combo;
  if(G.combo>1)float(x,y-34,G.combo+'x COMBO','#c9a6ff',15);charge(G.combo>1?1.6:1,'shot');}
function shot(id,x,y){qEvent('shot',id);const bo=G.boss;if(bo&&bo.alive&&bo.phase==='cast'&&bo.def.cast.shots.includes(id))interruptBoss(bo);}
function jackpot(x,y){const m=G.mb;if(!m)return;score(m.jackpot*G.mods.jackpot,x,y,'JACKPOT');m.jackpot=Math.min(200000,m.jackpot+8000);G.run.stat.jackpots++;A.s('jackpot');G.flash=.35;G.flashC='#ffd24a';}
function ability(){const r=G.run,c=CLASSES[r.cls],b=focusBall();G.flash=.4;G.flashC=c.glow;A.s('ability');
  switch(r.cls){
  case 'knight':if(r.shield)heal(15);r.shield=true;G.buffs.aegis=12;popup('Aegis','A ward will save your next lost ball','good');break;
  case 'rogue':G.buffs.stealth=12;popup('Shadowstrike','Every hit crits for 12 seconds','good');break;
  case 'mage':{popup('Arcane Storm','Lightning strikes every foe on this level','good');const tier=G.focusTier;
    for(const e of G.enemies)if(e.tier===tier&&e.spawn<=0&&!e.dead){bolt(b,e);if(e.def.cast)e.castT=e.def.cast+1;e.armor=0;damageEnemy(e,G.mods.pow*3,false);}
    const bo=G.boss;if(bo&&bo.alive&&bo.tier===tier){bolt(b,bo);if(bo.phase==='cast')interruptBoss(bo);else if(bo.phase!=='shield')hitBoss(bo,G.mods.pow*3,false);}
    if(b&&b.st==='live'&&G.balls.length===1&&!G.plunge.ready)G.balls.push(newBall(b.x,b.y,-b.vx||140,b.vy*.9-80));break;}
  case 'cleric':heal(35);G.curse={};r.kickback=true;G.save=Math.max(G.save,8);popup('Sanctify','Healed and cleansed. Kickback lit','good');
    for(const e of G.enemies)if(e.def.undead&&e.spawn<=0&&!e.dead){bolt(b,e);damageEnemy(e,G.mods.pow*2.5,false);}break;}
  relight();}

/* ---------- class powers: cradle to charge, class nudge, ball traits ---------- */
function endPower(b,expired){const c=G.run.cls;b.pow=null;if(expired){if(c==='mage')explode(b.x,b.y);else if(c==='cleric')consecrate(b.x,b.y);}}
function powerImpact(b,type){if(!b||!b.pow)return;const c=G.run.cls;if(c==='mage'){endPower(b);explode(b.x,b.y);}else if(c==='cleric'){endPower(b);consecrate(b.x,b.y);}}
function explode(x,y){const m=G.mods;G.booms.push({x,y,r:140,t:0,c:'#ff8a3a'});burst(x,y,40,'#ffb050',440,.9);A.s('slam');G.cam.shake=Math.max(G.cam.shake,12);G.flash=.3;G.flashC='#ff8a3a';
  for(const e of G.enemies){if(e.dead||e.spawn>0||Math.hypot(e.x-x,e.y-y)>130+e.r)continue;if(e.def.cast)e.castT=e.def.cast+1;e.armor=0;damageEnemy(e,m.pow*2.5,false);}
  const bo=G.boss;if(bo&&bo.alive&&bo.rise<=0&&bo.phase!=='shield'&&Math.hypot(bo.x-x,bo.y-y)<150+bo.r)hitBoss(bo,m.pow*2.5,false);}
function consecrate(x,y){G.zones.push({x,y,r:100,t:9,tick:0});heal(8);A.s('ward');burst(x,y,24,'#ffe0a0',260,.9);float(x,y-30,'CONSECRATED','#ffe0a0',13);}
function classNudge(){const r=G.run,m=G.mods,c=r.cls,live=G.balls.filter(b=>b.st==='live');if(G.nudgeCd>0||!live.length||G.fallen)return;G.nudgeCd=2.5;
  const near=(e,d)=>!e.dead&&e.spawn<=0&&live.some(b=>Math.hypot(b.x-e.x,b.y-e.y)<d);
  if(c==='knight'){for(const b of live)G.booms.push({x:b.x,y:b.y,r:150,t:0,c:'#8fb0d8'});
    for(const e of G.enemies)if(near(e,150)){e.atk=Math.max(e.atk,6);if(e.def.cast)e.castT=Math.max(e.castT,e.def.cast*.8);damageEnemy(e,m.pow*.4,false);}}
  else if(c==='rogue'){G.phase=.7;for(const b of live)burst(b.x,b.y,10,'#b08cff',180,.5);}
  else if(c==='mage'){const b=focusBall();let best=null,bd=280;for(const e of G.enemies){if(e.dead||e.spawn>0||e.tier!==tierOf(b.y))continue;const d=Math.hypot(e.x-b.x,e.y-b.y);if(d<bd){bd=d;best=e;}}
    if(best){bolt(b,best);if(best.def.cast)best.castT=best.def.cast+1;damageEnemy(best,m.pow*.8,false);}
    else{const bo=G.boss;if(bo&&bo.alive&&bo.rise<=0&&bo.phase!=='shield'&&Math.hypot(bo.x-b.x,bo.y-b.y)<320){bolt(b,bo);hitBoss(bo,m.pow*.5,false);}}}
  else{heal(3);for(const k in G.curse)if(G.curse[k]>0){G.curse[k]=0;break;}for(const b of live)G.booms.push({x:b.x,y:b.y,r:150,t:0,c:'#ffcf70'});
    for(const e of G.enemies)if(e.def.undead&&near(e,150))damageEnemy(e,m.pow*.5,false);}}
function updatePowers(dt){const r=G.run,c=r.cls,m=G.mods,cl=CLASSES[c];G.hidden=false;if(G.phase>0)G.phase-=dt;if(G.nudgeCd>0)G.nudgeCd-=dt;
  for(const b of G.balls){if(b.st!=='live'){b.cr=0;continue;}
    let held=false;if(b.onFlip>0&&!b.arm&&!b.pow&&G.tilt<=0&&r.charge>=33&&Math.hypot(b.vx,b.vy)<95)for(const f of T.flips)if(f.on&&f.a<=f.up+.02&&Math.abs(b.x-f.x)<75&&Math.abs(b.y-f.y)<60){held=true;break;}
    if(held){b.cr+=dt;if(b.cr>=.8){b.cr=0;G.dirty=true;if(r.charge>=100){r.charge=0;ability();}else{r.charge-=33;b.arm=9;A.s('ward');float(b.x,b.y-30,cl.shot.toUpperCase()+' READY',cl.glow,13);}}}
    else if(b.cr>0)b.cr=Math.max(0,b.cr-dt*2);
    if(b.arm>0){b.arm=Math.max(0,b.arm-dt);if(c==='rogue')G.hidden=true;}
    if(b.pow){b.pow.t-=dt;if(c==='rogue')G.hidden=true;if(b.pow.t<=0)endPower(b,true);}
    if(c==='mage'||c==='cleric'){b.tk-=dt;if(b.tk<=0){b.tk=c==='mage'?.12:.5;
      for(const e of G.enemies){if(e.dead||e.spawn>0)continue;const d=Math.hypot(e.x-b.x,e.y-b.y);
        if(c==='mage'){if(d<b.r+e.r+24&&!(e.wakeT>G.t)){e.wakeT=G.t+1;bolt(b,e);damageEnemy(e,m.pow*.35,false);}}
        else if(e.def.undead&&d<85)damageEnemy(e,m.pow*.2,false);}}}}
  for(const z of G.zones){z.t-=dt;z.tick-=dt;if(z.tick<=0){z.tick=.5;
    for(const e of G.enemies){if(e.dead||e.spawn>0||Math.hypot(e.x-z.x,e.y-z.y)>z.r+e.r)continue;e.atk+=.3;damageEnemy(e,m.pow*.4*(e.def.undead?2:1),false);}
    const bo=G.boss;if(bo&&bo.alive&&bo.rise<=0&&bo.phase!=='shield'&&Math.hypot(bo.x-z.x,bo.y-z.y)<z.r+bo.r)hitBoss(bo,m.pow*.4,false);
    if(G.balls.some(b=>b.st==='live'&&Math.hypot(b.x-z.x,b.y-z.y)<z.r))heal(1.5);}}

function buildSprites(){
  for(const k in EDRAW){const cv=mkCanvas(128,128),c=cv.getContext('2d');c.translate(64,64);c.scale(2,2);c.lineJoin='round';
    c.fillStyle='rgba(0,0,0,.45)';c.beginPath();c.ellipse(0,ENEMY[k].r+3,ENEMY[k].r*.9,5,0,0,TAU);c.fill();EDRAW[k](c);R.spr[k]=cv;}
  for(const k in BDRAW){const cv=mkCanvas(320,320),c=cv.getContext('2d');c.translate(160,160);c.scale(2,2);c.lineJoin='round';BDRAW[k](c);R.spr['b_'+k]=cv;}
  for(const k in CLASSES){const cl=CLASSES[k],cv=mkCanvas(64,64),c=cv.getContext('2d');c.translate(32,32);
    const g=c.createRadialGradient(-8,-9,2,0,0,28);g.addColorStop(0,'#ffffff');g.addColorStop(.25,cl.color);g.addColorStop(1,'#11121c');c.fillStyle=g;c.beginPath();c.arc(0,0,28,0,TAU);c.fill();

    if(cl.sig==='shield'){c.moveTo(-10,-12);c.lineTo(10,-12);c.lineTo(10,2);c.lineTo(0,14);c.lineTo(-10,2);c.closePath();}
    else if(cl.sig==='dagger'){c.moveTo(0,-16);c.lineTo(4,4);c.lineTo(-4,4);c.closePath();c.moveTo(-9,5);c.lineTo(9,5);c.moveTo(0,5);c.lineTo(0,15);}

}

function drawBall(c,b,cls,over){const cl=CLASSES[cls],s=1+.2*b.hgt,r=b.r*s,t=G.t,hot=b.pow||b.arm>0;
  if(cls==='cleric'&&b.st==='live'){c.strokeStyle='rgba(255,224,160,.13)';c.lineWidth=2;c.beginPath();c.arc(b.x,b.y,85,0,TAU);c.stroke();}
  if(b.hgt>0){c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(b.x+7*b.hgt,b.y+11*b.hgt,r,r*.9,0,0,TAU);c.fill();}
  const tr=b.trail;c.fillStyle=b.pow?(cls==='mage'?'#ff8a3a':cl.glow):cl.glow;for(let k=0;k<tr.length-2;k+=2){c.globalAlpha=(b.pow?.07:.035)*(k+2);c.beginPath();c.arc(tr[k],tr[k+1],r*((b.pow?.7:.45)+k*.03),0,TAU);c.fill();}c.globalAlpha=1;
  c.globalCompositeOperation='lighter';drawGlow(c,b.x,b.y,r*(hot?5.5:3.2),b.pow&&cls==='mage'?'#ff8a3a':cl.glow,hot?.6+.3*Math.sin(t*14):.4);c.globalCompositeOperation='source-over';
  if(G.phase>0||(cls==='rogue'&&hot))c.globalAlpha=.5;
  c.save();c.translate(b.x,b.y);c.rotate(b.rot||0);c.drawImage(R.spr['ball_'+cls],-r,-r,r*2,r*2);c.restore();c.globalAlpha=1;
  if(b.cr>0){c.strokeStyle='#05050a';c.lineWidth=5;c.beginPath();c.arc(b.x,b.y,r+7,0,TAU);c.stroke();c.strokeStyle=cl.glow;c.lineWidth=3;c.beginPath();c.arc(b.x,b.y,r+7,-PI/2,-PI/2+TAU*Math.min(1,b.cr/.8));c.stroke();}

R.frame=function(){const c=R.c,cv=R.cv,sc=R.scale,t=G.t,run=G.run,cls=run?run.cls:'knight';if(!R.ready)return;

  c.setTransform(1,0,0,1,0,0);c.fillStyle='#050508';c.fillRect(0,0,cv.width,cv.height);
  const blit=L=>{c.setTransform(1,0,0,1,0,0);for(let k=0;k<L.length;k++){const top=k*R.CH+R.Y0;if(top>y1||top+R.CH<y0)continue;c.drawImage(L[k],0,0,L[k].width,L[k].height,Math.round(ox*sc),Math.round((top-camY)*sc),Math.ceil(W*sc),Math.ceil(R.CH*sc)+1);}c.setTransform(sc,0,0,sc,ox*sc,-camY*sc);};

      c.fillStyle=lit||sk?(s.set==='moon'?'#cfeef2':'#ffc060'):'rgba(0,0,0,.5)';c.beginPath();c.arc(s.x,s.y,7,0,TAU);c.fill();c.strokeStyle='rgba(230,220,200,.5)';c.lineWidth=1.2;c.stroke();
      if(lit||sk){c.globalCompositeOperation='lighter';drawGlow(c,s.x,s.y,26,s.set==='moon'?'#bfe8ee':'#ffb040',.7);c.globalCompositeOperation='source-over';}}
    else if(s.kind==='inlane'||s.kind==='outlane'){c.fillStyle=s.flash>0?'#ffe6a0':'rgba(0,0,0,.45)';c.beginPath();c.moveTo(s.x,s.y-7);c.lineTo(s.x+6,s.y);c.lineTo(s.x,s.y+7);c.lineTo(s.x-6,s.y);c.closePath();c.fill();c.strokeStyle='rgba(230,220,200,.35)';c.lineWidth=1;c.stroke();}

  while(acc>=1/120&&n<8){gameStep(1/120);acc-=1/120;n++;}if(n===8)acc=0;
  R.frame();hudT+=dt;if(hudT>.2){hudT=0;G.dirty=true;}UI.sync();}
function boot(){initGame();R.cv=$('cv');R.c=R.cv.getContext('2d',{alpha:false});buildSprites();R.ss=0;resize();bindInput();startDemo();UI.menu('title');requestAnimationFrame(loop);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(R.ready)R.build();});}
boot();

</script>
